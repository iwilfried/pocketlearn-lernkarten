.hero h1 { font-size: clamp(28px, 6vw, 40px); line-height: 1.1; letter-spacing: -.01em; }

.setup { display: flex; flex-direction: column; gap: 18px; }

}

/* Lernkarte */
.session-head { display: flex; align-items: center; gap: 12px; }

.reveal { width: 100%; }
.rate { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.rate button { border: 1px solid var(--rule-strong); background: var(--surface); border-radius: 12px; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-weight: 700; color: var(--c); }

/* Abschluss */
.done { text-align: left; display: flex; flex-direction: column; gap: 14px; }

/* Stöbern */

.list { display: flex; flex-direction: column; border-top: 1px solid var(--rule-strong); }
.row { border-bottom: 1px solid var(--rule); }

/* Einstellungen */

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--on-ink); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 20; }

}

.wel ul.rl { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px; }
.wel .btn.primary { width: 100%; font-size: 17px; padding: 16px; }
.wel .wel-go { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 480px) { .wel .wel-go { grid-template-columns: 1fr; } }
.wel .more { background: transparent; border: 0; color: var(--muted); text-decoration: underline; font-size: 15px; padding: 6px; align-self: center; }
@media (max-width: 400px) { .wel .how { grid-template-columns: 1fr; } .wel .how div { display: flex; align-items: center; gap: 10px; } .wel .how b { margin: 0; flex: none; } }
.mech-steps { margin: 10px 0 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 8px; font-size: 15px; }
.mech-steps li::marker { font-weight: 700; color: var(--accent); }
.mech .g { font-weight: 700; color: var(--c); white-space: nowrap; }
.mech-tl { display: grid; grid-template-columns: repeat(5, 1fr); }
.mech-tl div { position: relative; padding-top: 22px; text-align: center; font-size: 12px; }
.mech-tl div::before { content: ""; position: absolute; top: 7px; left: 0; right: 0; height: 3px; background: var(--surface-2); }
.mech-tl div:first-child::before { left: 50%; } .mech-tl div:last-child::before { right: 50%; }
.mech-tl div::after { content: ""; position: absolute; top: 2px; left: 50%; margin-left: -7px; width: 14px; height: 14px; border-radius: 50%; background: var(--good); border: 2px solid var(--bg); }
.mech-tl div.ok::after { background: var(--easy); }
.mech-tl b { display: block; font-family: var(--f-mono); font-size: 12px; }
.mech-tl span { color: var(--muted); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<header class="top"><div class="top-in">
  <button type="button" class="brand" id="brandBtn" title="Zur Willkommensseite" aria-label="Zur Willkommensseite"><small>pocketlearn · Lernkarten</small><b id="deckTitle">EU AI Act</b></button>
  <nav class="nav" aria-label="Bereiche">
    <button id="navHome" data-view="home" aria-current="true">Lernen</button>
    <button id="navThemes" data-view="themes" hidden>Themen</button>
    <button id="navGuide" data-view="guide">So lernst du</button>
    <button id="navBrowse" data-view="browse">Alle Karten</button>
    <button id="navSettings" data-view="settings">Fortschritt</button>
  </nav>
</div></header>

<nav class="fam wrap" id="fam" aria-label="Prüfungsbereich" hidden></nav>
<main class="wrap" id="app"></main>
<footer id="foot"></footer>
<div class="toast" id="toast" hidden></div>

<!--DECK-->
<script>
(function () {
  "use strict";
  const D = window.DECK;
  const CARDS = D.cards;
  const BY_ID = Object.fromEntries(CARDS.map(c => [c.id, c]));
  const KEY = "pocketlearn-karten:" + D.meta.id;
  const DAY = 86400000;
  // Prüfungshäufigkeit: Anzahl der Prüfungsbezüge wie „S24 2.1“
  function freq(c) { return (c.src || "").split(",").filter(x => /^\s*[SW]\d\d/.test(x)).length; }
  function exams(c) { return (c.src || "").split(",").map(x => (x.trim().match(/^[SW]\d\d/) || [])[0]).filter(Boolean); }
  const HAS_SRC = CARDS.some(c => freq(c) > 0);
  // Installation als App
  let installEvt = null;
  const IS_STANDALONE = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
  const UA = navigator.userAgent || "";
  const IS_IOS = /iPhone|iPad|iPod/.test(UA) || (/Macintosh/.test(UA) && navigator.maxTouchPoints > 1);
  const IS_ANDROID = /Android/.test(UA);
  window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; if (!Q && $("#startBtn")) renderHome(); });
  window.addEventListener("appinstalled", () => { installEvt = null; S.settings.hideInstall = true; save(); if (!Q && $("#startBtn")) renderHome(); });

  // ---------- Speicher ----------
  function load() {
    try { const raw = localStorage.getItem(KEY); if (raw) return JSON.parse(raw); } catch (e) {}
    return { cards: {}, settings: { mode: "frage", cat: "all", newPerSession: 10, order: "wichtig" } };
  }
  let S = load();
  S.cards = S.cards || {}; S.settings = Object.assign({ mode: "frage", cat: "all", newPerSession: 10, order: "wichtig" }, S.settings || {});
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

  // ---------- Wiederholungsplan (vereinfachtes SM-2) ----------
  function stateOf(id) { return S.cards[id] || null; }
  function status(id) {
    const s = stateOf(id); if (!s) return "neu";
    return s.ivl >= 21 ? "sicher" : "lernend";
  }
  function isDue(id, now) { const s = stateOf(id); return s && s.due <= now; }
  function preview(id, grade) {
    const s = stateOf(id) || { ivl: 0, ease: 2.5, reps: 0, lapses: 0 };
    let ivl = s.ivl, ease = s.ease;
    if (grade === 0) return { ivl: 0, ease: Math.max(1.3, ease - .2) };
    if (s.reps === 0 || ivl === 0) ivl = grade === 1 ? 1 : grade === 2 ? 2 : 4;
    else if (grade === 1) { ivl = Math.max(1, Math.round(ivl * 1.2)); ease = Math.max(1.3, ease - .15); }
    else if (grade === 2) ivl = Math.round(ivl * ease);
    else { ivl = Math.round(ivl * ease * 1.3); ease = ease + .15; }
    return { ivl: Math.min(ivl, 365), ease };
  }
  function grade(id, g) {
    const s = stateOf(id) || { ivl: 0, ease: 2.5, reps: 0, lapses: 0 };
    const p = preview(id, g);
    s.ivl = p.ivl; s.ease = p.ease; s.reps += 1; if (g === 0) s.lapses += 1;
    s.due = g === 0 ? Date.now() : Date.now() + p.ivl * DAY;
    s.last = Date.now();
    S.cards[id] = s; save();
  }
  function fmtIvl(d) {
    if (d === 0) return "gleich";
    if (d === 1) return "1 Tag";
    if (d < 30) return d + " Tage";
    if (d < 365) return Math.round(d / 30) + " Mon.";
    return "1 Jahr";
  }

  // ---------- Hilfen ----------
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const catName = c => D.meta.categories[c] || c;
  const CAT_KEYS = Object.keys(D.meta.categories);
  const catVar = c => `--c: var(--cat-${c}, var(--k${Math.max(0, CAT_KEYS.indexOf(c)) % 9}))`;
  function pool() { return S.settings.cat === "all" ? CARDS : CARDS.filter(c => c.cat === S.settings.cat); }
  function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2200); }
  function setNav(v) { document.querySelectorAll(".nav button").forEach(b => b.setAttribute("aria-current", b.dataset.view === v ? "true" : "false")); }
  function famVisible(on) { const f = document.getElementById("fam"); if (f && f.dataset.on) f.hidden = !on; }

  // ---------- Ansicht: Start ----------
  const SHARE_SVG = '<svg class="sh" width="16" height="18" viewBox="0 0 15 17" aria-hidden="true"><path d="M7.5 1v10M4 4.5 7.5 1 11 4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 7.5H2.5v8h10v-8H10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>';
  function installBox() {
    if (IS_STANDALONE || S.settings.hideInstall) return "";
    let tx = "", btn = "";
    if (installEvt) { tx = "<b>Als App aufs Handy holen</b>Mit eigenem Symbol auf dem Startbildschirm, auch offline."; btn = '<button class="btn primary" id="installBtn" style="padding:10px 16px;font-size:15px">Installieren</button>'; }
    else if (IS_IOS) tx = "<b>Als App aufs iPhone holen</b>In Safari unten auf " + SHARE_SVG + " <b style=\"display:inline\">Teilen</b> tippen, dann „Zum Home-Bildschirm“ und „Hinzufügen“.";
    else if (IS_ANDROID) tx = "<b>Als App aufs Handy holen</b>Oben rechts auf die drei Punkte ⋮ tippen, dann „Zum Startbildschirm hinzufügen“ oder „App installieren“.";
    else return "";
    return `<div class="install" id="installBox"><div class="ic" aria-hidden="true">⤓</div><div class="tx">${tx}</div>${btn}<button class="x" id="installX" aria-label="Hinweis ausblenden">×</button></div>`;
  }
  function renderHome() {
    famVisible(true);
    setNav("home");
    const now = Date.now(), P = pool();
    const due = P.filter(c => isDue(c.id, now)).length;
    const neu = P.filter(c => !stateOf(c.id)).length;
    const lern = P.filter(c => status(c.id) === "lernend").length;
    const sicher = P.filter(c => status(c.id) === "sicher").length;
    const tot = P.length || 1;
    const catCounts = CARDS.reduce((a, c) => (a[c.cat] = (a[c.cat] || 0) + 1, a), {});
    const willStudy = due + Math.min(neu, S.settings.newPerSession);
    $("#app").innerHTML = `
      <section class="view">
        ${installBox()}
        <div class="hero">
          <span class="eyebrow">${esc(D.meta.subtitle)}</span>
          <h1>${esc(D.meta.title)}</h1>
          <p>${esc(D.meta.intro)}</p>
        </div>
        <div>
          <div class="stats">
            <div class="stat due"><b>${due}</b><span>heute fällig</span></div>
            <div class="stat"><b>${neu}</b><span>neu</span></div>
            <div class="stat"><b>${lern}</b><span>in Arbeit</span></div>
            <div class="stat"><b>${sicher}</b><span>sicher</span></div>
          </div>
          <div style="margin-top:14px">
            <div class="meter" role="img" aria-label="${sicher} sicher, ${lern} in Arbeit, ${neu} neu von ${P.length}">
              <i style="width:${sicher / tot * 100}%;background:var(--easy)"></i>
              <i style="width:${lern / tot * 100}%;background:var(--accent)"></i>
            </div>
            <div class="meter-legend"><span style="--c:var(--easy)">sicher (≥ 21 Tage)</span><span style="--c:var(--accent)">in Arbeit</span><span style="--c:var(--surface-2)">neu</span></div>
          </div>
        </div>
        <div class="setup">
          <div class="field">
            <span class="label">Vorderseite</span>
            <div class="seg" role="group" aria-label="Vorderseite">
              <button id="modeFrage" data-mode="frage" aria-pressed="${S.settings.mode === "frage"}">Frage</button>
              <button id="modeBegriff" data-mode="begriff" aria-pressed="${S.settings.mode === "begriff"}">Begriff</button>
            </div>
            <p class="hint">${S.settings.mode === "frage" ? "Du siehst eine Frage und antwortest frei." : "Du siehst nur den Fachbegriff und erklärst ihn."}</p>
          </div>
          <div class="field">
            <span class="label">Themenbereich</span>
            <div class="chips">
              <button class="chip" data-all data-cat="all" aria-pressed="${S.settings.cat === "all"}">Alle <em>${CARDS.length}</em></button>
              ${Object.keys(D.meta.categories).filter(k => catCounts[k]).map(k => `<button class="chip" style="${catVar(k)}" data-cat="${k}" aria-pressed="${S.settings.cat === k}">${esc(catName(k))} <em>${catCounts[k]}</em></button>`).join("")}
            </div>
          </div>
          <div class="field">
            <span class="label">Neue Karten pro Runde</span>
            <div class="seg" role="group" aria-label="Neue Karten pro Runde">
              ${[5, 10, 20, 50].map(n => `<button data-new="${n}" aria-pressed="${S.settings.newPerSession === n}">${n}</button>`).join("")}
            </div>
          </div>
          ${HAS_SRC ? `<div class="field"><span class="label">Reihenfolge neuer Karten</span>
            <div class="seg" role="group" aria-label="Reihenfolge neuer Karten">
              <button data-order="wichtig" aria-pressed="${S.settings.order === "wichtig"}">Wichtigste zuerst</button>
              <button data-order="zufall" aria-pressed="${S.settings.order === "zufall"}">Zufällig</button>
            </div>
            <p class="hint">${S.settings.order === "wichtig" ? "Neue Karten kommen in der Reihenfolge, wie oft ihr Thema in den Prüfungen vorkam." : "Neue Karten kommen in zufälliger Reihenfolge."}</p>
          </div>` : ""}
          <div class="actions">
            <button class="btn primary" id="startBtn" ${willStudy ? "" : "disabled"}>${willStudy ? `Runde starten · ${willStudy} Karten` : "Für heute alles erledigt"}</button>
            <button class="btn" id="cramBtn">Freies Üben (zufällig 20)</button>
          </div>
          <p class="hint">Fällige Karten kommen zuerst, danach neue. „Freies Üben“ verändert den Plan nicht.</p>
        </div>
      </section>`;
    document.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { S.settings.mode = b.dataset.mode; save(); renderHome(); });
    document.querySelectorAll("[data-cat]").forEach(b => b.onclick = () => { S.settings.cat = b.dataset.cat; save(); renderHome(); });
    document.querySelectorAll("[data-new]").forEach(b => b.onclick = () => { S.settings.newPerSession = +b.dataset.new; save(); renderHome(); });
    document.querySelectorAll("[data-order]").forEach(b => b.onclick = () => { S.settings.order = b.dataset.order; save(); renderHome(); });
    if ($("#installBtn")) $("#installBtn").onclick = () => { const ev = installEvt; if (!ev) return; ev.prompt(); (ev.userChoice || Promise.resolve()).then(r => { if (r && r.outcome === "accepted") { installEvt = null; renderHome(); } }); };
    if ($("#installX")) $("#installX").onclick = () => { S.settings.hideInstall = true; save(); renderHome(); };
    $("#startBtn").onclick = () => startSession(false);
    $("#cramBtn").onclick = () => startSession(true);
  }

  // ---------- Lernrunde ----------
  let Q = null;
  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function startSession(cram) {
    const now = Date.now(), P = pool();
    let ids;
    if (cram) ids = shuffle(P.map(c => c.id)).slice(0, 20);
    else {
      const due = P.filter(c => isDue(c.id, now)).sort((a, b) => S.cards[a.id].due - S.cards[b.id].due).map(c => c.id);
      let neuC = shuffle(P.filter(c => !stateOf(c.id)));
      if (HAS_SRC && S.settings.order === "wichtig") neuC.sort((a, b) => freq(b) - freq(a));
      const neu = neuC.slice(0, S.settings.newPerSession).map(c => c.id);
      ids = due.concat(HAS_SRC && S.settings.order === "wichtig" ? neu : shuffle(neu));
    }
    if (!ids.length) return;
    Q = { ids, i: 0, total: ids.length, cram, revealed: false, explained: false, again: 0, done: 0 };
    markView("session");
    renderCard();
  }
  function renderCard() {
    famVisible(false);
    setNav("home");
    if (Q.i >= Q.ids.length) return renderDone();
    const c = BY_ID[Q.ids[Q.i]], mode = S.settings.mode, st = status(c.id);
    const risk = c.risk ? `<span class="tag" style="--c:var(--risk-${c.risk})">${esc(D.meta.risks[c.risk] || c.risk)}</span>` : "";
    const front = mode === "frage" ? `<div class="front">${esc(c.q)}</div>` : `<div class="front term">${esc(c.term)}</div>`;
    const pct = Math.round(Q.done / Q.total * 100);
    let ans = "";
    if (Q.revealed) {
      const links = (c.links || []).length ? `<span class="sub">Quellen</span><ul>${c.links.map(l => `<li><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a></li>`).join("")}</ul>` : "";
      const rel = (c.related || []).filter(r => BY_ID[r]);
      const relHtml = rel.length ? `<span class="sub">Verwandte Begriffe</span><div class="related">${rel.map(r => `<button data-peek="${r}">${esc(BY_ID[r].term)}</button>`).join("")}</div>` : "";
      ans = `<div class="answer">
        ${mode === "frage" ? `<div class="term-line">${esc(c.term)}</div>` : ""}
        <p class="short">${esc(c.short)}</p>
        <button class="explain-toggle" id="explainBtn" aria-expanded="${Q.explained}">${Q.explained ? "Erklärung ausblenden" : "Erklärung anzeigen"}</button>
        ${Q.explained ? `<div class="long"><span class="sub">Erklärung</span><p>${esc(c.long)}</p>${relHtml}${links}</div>` : ""}
      </div>`;
    }
    const grades = [["Nochmal", "--again"], ["Schwer", "--hard"], ["Gut", "--good"], ["Leicht", "--easy"]];
    $("#app").innerHTML = `
      <section class="view">
        <div class="session-head">
          <button class="btn ghost" id="quitBtn" aria-label="Runde beenden">✕ Beenden</button>
          <div class="progress" aria-hidden="true"><i style="width:${pct}%"></i></div>
          <span class="count">${Q.done} / ${Q.total}</span>
        </div>
        <article class="card" aria-live="polite">
          <div class="card-meta">
            <span class="tag" style="${catVar(c.cat)}">${esc(catName(c.cat))}</span>${risk}
            <span class="tag state">${Q.cram ? "freies Üben" : st}</span>${freq(c) ? `<span class="freq">${freq(c)}× geprüft</span>` : ""}
          </div>
          ${front}
          ${ans}
        </article>
        ${Q.revealed
          ? `<div class="rate">${grades.map(([l, v], g) => `<button data-grade="${g}" style="--c:var(${v})">${l}<small>${Q.cram ? "&nbsp;" : fmtIvl(preview(c.id, g).ivl)}</small></button>`).join("")}</div>`
          : `<button class="btn primary reveal" id="revealBtn">Antwort zeigen</button>`}
        <p class="keys"><kbd>Leertaste</kbd> Antwort · <kbd>E</kbd> Erklärung · <kbd>1</kbd>–<kbd>4</kbd> bewerten</p>
      </section>`;
    $("#quitBtn").onclick = leaveSession;
    if ($("#revealBtn")) { $("#revealBtn").onclick = reveal; $("#revealBtn").focus({ preventScroll: true }); }
    if ($("#explainBtn")) $("#explainBtn").onclick = toggleExplain;
    document.querySelectorAll("[data-grade]").forEach(b => b.onclick = () => rate(+b.dataset.grade));
    document.querySelectorAll("[data-peek]").forEach(b => b.onclick = () => { const r = BY_ID[b.dataset.peek]; toast(r.term + ": " + r.short.slice(0, 140) + (r.short.length > 140 ? " …" : "")); });
  }
  function reveal() { if (!Q || Q.revealed) return; Q.revealed = true; renderCard(); }
  function toggleExplain() { if (!Q || !Q.revealed) return; Q.explained = !Q.explained; renderCard(); }
  function rate(g) {
    if (!Q || !Q.revealed) return;
    const id = Q.ids[Q.i];
    if (!Q.cram) grade(id, g);
    if (g === 0) { Q.ids.push(id); Q.again++; } else Q.done++;
    Q.i++; Q.revealed = false; Q.explained = false;
    renderCard();
  }
  function renderDone() {
    famVisible(true);
    const now = Date.now();
    const next = CARDS.map(c => stateOf(c.id)).filter(s => s && s.due > now).sort((a, b) => a.due - b.due)[0];
    const when = next ? new Date(next.due).toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "long" }) : null;
    $("#app").innerHTML = `
      <section class="view done">
        <span class="eyebrow">Runde abgeschlossen</span>
        <h2>${Q.total} Karten geschafft.</h2>
        <p>${Q.again ? `${Q.again}× „Nochmal“ – diese Karten kamen in derselben Runde erneut.` : "Keine Karte musste wiederholt werden."}
        ${!Q.cram && when ? ` Die nächste Wiederholung ist am ${when} fällig.` : ""}</p>
        <div class="actions"><button class="btn primary" id="homeBtn">Zur Übersicht</button><button class="btn" id="againBtn">Noch eine Runde</button></div>
      </section>`;
    $("#homeBtn").onclick = leaveSession;
    $("#againBtn").onclick = () => startSession(Q.cram);
  }

  // ---------- Ansicht: Alle Karten ----------
  let B = { q: "", cat: "all", open: null };
  // ---------- Ansicht: Themen (Prüfungshäufigkeit) ----------
  function renderThemes() {
    famVisible(true);
    setNav("themes"); Q = null;
    const allEx = new Set(); CARDS.forEach(c => exams(c).forEach(e => allEx.add(e)));
    const cats = Object.keys(D.meta.categories).map(k => {
      const cs = CARDS.filter(c => c.cat === k);
      const ex = new Set(); cs.forEach(c => exams(c).forEach(e => ex.add(e)));
      return { k, n: cs.length, hits: cs.reduce((a, c) => a + freq(c), 0), ex: ex.size,
        sicher: cs.filter(c => status(c.id) === "sicher").length, lern: cs.filter(c => status(c.id) === "lernend").length };
    }).filter(x => x.n).sort((a, b) => b.hits - a.hits);
    const maxHits = Math.max(1, ...cats.map(x => x.hits));
    const top = CARDS.filter(c => freq(c) > 0).sort((a, b) => freq(b) - freq(a)).slice(0, 15);
    $("#app").innerHTML = `
      <section class="view">
        <div class="hero"><span class="eyebrow">Ausgewertet: ${allEx.size} Prüfungen</span><h1>Wichtigste Themen</h1>
          <p>Wie oft ein Thema in den bisherigen Abschlussprüfungen vorkam – und wie viel du davon schon sicher kannst. Fang oben an.</p></div>
        <div class="tg">${cats.map(x => `
          <div class="trow" style="${catVar(x.k)}">
            <span class="nm">${esc(catName(x.k))}</span><span class="nb">${x.hits}× in ${x.ex} von ${allEx.size} Prüfungen</span>
            <div class="bars">
              <span>Prüfungen</span><div class="bar"><i style="width:${x.hits / maxHits * 100}%;background:var(--accent)"></i></div>
              <span>Dein Stand</span><div class="bar" title="${x.sicher} sicher, ${x.lern} in Arbeit von ${x.n}"><i style="width:${x.sicher / x.n * 100}%;background:var(--easy)"></i><i style="width:${x.lern / x.n * 100}%;background:var(--good);opacity:.55"></i></div>
            </div>
          </div>`).join("")}
        </div>
        <p class="hint">Grün = sicher, blau = in Arbeit. Rechenaufgaben haben eigene Zahlen und deshalb selten einen direkten Prüfungsbezug – geübt werden sollten sie trotzdem.</p>
        <div class="actions">
          <button class="btn primary" id="learnTop">Wichtigste zuerst lernen</button>
          <button class="btn" data-goto-cat="">Thema auswählen</button>
        </div>
        <h2 style="font-family:var(--f-display);font-size:22px;margin:8px 0 0">Die ${top.length} häufigsten Einzelthemen</h2>
        <div class="list top-list">${top.map(c => {
          const st = status(c.id), open = B.open === c.id;

  // ---------- So lernst du ----------
  const EXAM_KEY = "pocketlearn-karten:pruefung";
  function examDate() { try { return localStorage.getItem(EXAM_KEY) || ""; } catch (e) { return ""; } }
  function fmtDate(t) { return new Date(t).toLocaleDateString("de-DE", { day: "numeric", month: "long" }); }
  function planFor(dateStr, neuIn) {
    const neu = neuIn != null ? neuIn : CARDS.filter(c => !stateOf(c.id)).length;
    if (!dateStr) return null;
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const ex = new Date(dateStr + "T00:00:00"); if (isNaN(ex)) return null;
    const days = Math.round((ex - today) / DAY);
    const pick = n => [5, 10, 20, 50].find(x => x >= n) || 50;
    if (days < 0) return { days, msg: "Das Datum liegt in der Vergangenheit. Trag den Tag deiner Prüfung ein." };
    if (neu === 0) return { days, neu, msg: `Du hast schon alle Karten einmal gelernt. Bis zur Prüfung: jeden Tag nur die <b>fälligen Karten</b>. In der letzten Woche zusätzlich „Freies Üben“.` };
    if (days <= 7) return { days, neu, set: 20, warn: true, msg: `Nur noch ${days} Tag${days === 1 ? "" : "e"}. Neue Karten werden nicht mehr sicher. Lerne mit <b>„Wichtigste zuerst“</b> nur noch die häufigsten Themen (20 pro Runde), wiederhole die fälligen Karten und übe frei.` };
    const intro = days - 28 >= 7 ? days - 28 : Math.max(days - 7, 1);
    const per = Math.ceil(neu / intro), set = pick(per), endIntro = today.getTime() + Math.ceil(neu / set) * DAY;
    const tight = days - 28 < 7 || per > 50;
    return { days, neu, per, set, warn: tight, endIntro, ex: ex.getTime(),
      msg: `Noch <b>${days} Tage</b> bis zur Prüfung, <b>${neu} Karten</b> sind in diesem Bereich noch neu. Mit <b>${set} neuen Karten pro Tag</b> hast du alle bis zum <b>${fmtDate(endIntro)}</b> einmal gelernt.` +
        (tight ? ` <br><b>Achtung, knapp:</b> Für das Festigen bleibt wenig Zeit. Lass „Wichtigste zuerst“ eingestellt – dann kannst du auf jeden Fall die häufigsten Themen.` : ` Danach bleiben rund 3 Wochen zum Festigen und eine Woche zum Wiederholen.`) };
  }

        const o = JSON.parse($("#importBox").value);
        if (o.deck !== D.meta.id || !o.cards) throw new Error();
        S.cards = o.cards; save(); toast("Lernstand übernommen"); renderSettings();
      } catch (e) { toast("Der Text ist kein Lernstand für dieses Kartenset."); }
    };
    if ($("#resetBtn")) $("#resetBtn").onclick = () => renderSettings(true);
    if ($("#resetYes")) $("#resetYes").onclick = () => { S.cards = {}; save(); toast("Lernstand gelöscht"); renderSettings(); };
    if ($("#resetNo")) $("#resetNo").onclick = () => renderSettings();
    $("#welAgain").onclick = () => nav("welcome");
  }

  // ---------- Steuerung ----------
  // Jede Ansicht hat eine eigene Adresse (#themen, #fortschritt …), damit die Zurück-Taste des Handys funktioniert.
  const HASH = { home: "", themes: "themen", guide: "so-lernst-du", browse: "karten", settings: "fortschritt", session: "runde", welcome: "willkommen" };
  function viewFromHash() { const h = location.hash.replace("#", ""); const v = Object.keys(HASH).find(k => HASH[k] && HASH[k] === h); return v || "home"; }
  function urlFor(v) { return HASH[v] ? "#" + HASH[v] : location.pathname + location.search; }
  function curState() { return (history.state && history.state.v) || viewFromHash(); }
  function markView(v, replace) {
    try {
      if (replace) history.replaceState({ v }, "", urlFor(v));
      else if (curState() !== v) history.pushState({ v }, "", urlFor(v));
    } catch (e) {}
  }
  function show(v) {
    if (v !== "session") Q = null;
    if (v === "welcome") { renderWelcome(); }
    else {
      showChrome(true);
      if (v === "themes" && HAS_SRC) renderThemes();
      else if (v === "guide") renderGuide();
      else if (v === "browse") renderBrowse();
      else if (v === "settings") renderSettings();
      else renderHome();
    }
    window.scrollTo(0, 0);
  }
  function nav(v, replace) { markView(v, replace); show(v); }
  function leaveSession() {
    Q = null;
    if (curState() === "session" && history.length > 1) { try { history.back(); return; } catch (e) {} }
    nav("home", true);
  }
  window.addEventListener("popstate", e => {
    const v = (e.state && e.state.v) || viewFromHash();
    if (v === "session") { if (Q) return; markView("home", true); show("home"); return; }
    show(v);
  });
  document.querySelectorAll(".nav button").forEach(b => b.onclick = () => nav(b.dataset.view));
  $("#brandBtn").onclick = () => { if (curState() !== "welcome") nav("welcome"); };
  document.addEventListener("keydown", e => {
    if (!Q || e.target.matches("input, textarea")) return;
    if ((e.key === " " || e.key === "Enter") && !Q.revealed) { e.preventDefault(); reveal(); }
    else if ((e.key === "e" || e.key === "E") && Q.revealed) toggleExplain();
    else if (["1", "2", "3", "4"].includes(e.key) && Q.revealed) rate(+e.key - 1);
  });
  $("#deckTitle").textContent = D.meta.title;
  if (HAS_SRC) $("#navThemes").hidden = false;
  if (Array.isArray(D.meta.family) && D.meta.family.length > 1) {
    const f = $("#fam"); f.hidden = false; f.dataset.on = "1";
    f.innerHTML = '<span class="lbl">Prüfungsbereich</span>' + D.meta.family.map(x => `<a href="${esc(x.href)}"${x.current ? ' aria-current="page"' : ""}>${esc(x.label)}</a>`).join("");
  }
  $("#foot").innerHTML = (D.meta.source ? `Inhalte: <a href="${esc(D.meta.source)}" target="_blank" rel="noopener">${esc(D.meta.sourceLabel)}</a>` : esc(D.meta.sourceLabel)) + ` · ${esc(D.meta.publisher)}`;
  {
    let v = viewFromHash();
    if (v === "session" || (v === "welcome" && welcomeSeen())) v = "home";
    if (!welcomeSeen()) v = "welcome";
    markView(v, true); show(v);
  }
})();
</script>
